name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vMAJOR.MINOR.PATCH tag to publish
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Validate, build, attest, and publish
    if: github.repository == 'Killersumit/ani-tui'
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Validate release tag
        id: release
        shell: bash
        env:
          REQUESTED_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          tag=$REQUESTED_TAG
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            printf 'Invalid release tag: %s\n' "$tag" >&2
            exit 2
          fi
          git rev-parse --verify "refs/tags/$tag^{commit}" >/dev/null
          commit=$(git rev-parse "refs/tags/$tag^{commit}")
          short_commit=$(git rev-parse --short=12 "$commit")
          build_date=$(date -u -d "$(git show -s --format=%cI "$commit")" +%Y-%m-%dT%H:%M:%SZ)
          version=${tag#v}
          prerelease=false
          dist_tag=latest
          if [[ "$version" == *-* ]]; then
            prerelease=true
            dist_tag=${version#*-}
            dist_tag=${dist_tag%%.*}
          fi
          {
            printf 'tag=%s\n' "$tag"
            printf 'version=%s\n' "$version"
            printf 'commit=%s\n' "$short_commit"
            printf 'build_date=%s\n' "$build_date"
            printf 'prerelease=%s\n' "$prerelease"
            printf 'dist_tag=%s\n' "$dist_tag"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: npm/package.json

      - name: Go preflight
        run: |
          test -z "$(gofmt -l .)"
          go test -race ./...
          go vet ./...
          go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      - name: Distribution preflight
        run: |
          npx --yes shellcheck@4.1.0 install.sh uninstall.sh scripts/*.sh
          ./scripts/test-distribution.sh
          python3 ./scripts/test-installer-pty.py
      - name: npm preflight
        working-directory: npm
        run: |
          npm test
          npm pack --dry-run --ignore-scripts

      - name: Build seven release targets
        env:
          VERSION: ${{ steps.release.outputs.tag }}
          COMMIT: ${{ steps.release.outputs.commit }}
          BUILD_DATE: ${{ steps.release.outputs.build_date }}
        run: ./scripts/build-release.sh

      - name: Verify host artifact metadata and checksums
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
          COMMIT: ${{ steps.release.outputs.commit }}
          BUILD_DATE: ${{ steps.release.outputs.build_date }}
        run: |
          set -euo pipefail
          (cd release && sha256sum --check checksums.txt)
          metadata=$(./release/ani-tui-linux-x64 --version)
          [[ "$metadata" == *"$TAG"* ]]
          [[ "$metadata" == *"$COMMIT"* ]]
          [[ "$metadata" == *"$BUILD_DATE"* ]]
          [[ "$(find release -maxdepth 1 -type f -name 'ani-tui-*' | wc -l)" -eq 7 ]]

      - name: Attest native binaries
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: release/ani-tui-*

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            args=(release create "$TAG" --verify-tag --generate-notes --title "ani-tui $TAG")
            if [[ "$PRERELEASE" == true ]]; then
              args+=(--prerelease)
            fi
            gh "${args[@]}"
          fi
          gh release upload "$TAG" release/ani-tui-* release/checksums.txt --clobber

      - name: Set npm package version
        if: env.NPM_TOKEN != ''
        working-directory: npm
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: npm pkg set "version=$VERSION"

      - name: Publish npm package with provenance
        if: env.NPM_TOKEN != ''
        working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
          DIST_TAG: ${{ steps.release.outputs.dist_tag }}
        shell: bash
        run: |
          set -euo pipefail
          if npm view "ani-tui@$VERSION" version >/dev/null 2>&1; then
            printf 'ani-tui@%s already exists; leaving it unchanged.\n' "$VERSION"
            exit 0
          fi
          npm publish --access public --provenance --tag "$DIST_TAG"

      - name: Explain skipped npm publication
        if: env.NPM_TOKEN == ''
        run: echo 'NPM_TOKEN is not configured; GitHub assets were published and npm was intentionally skipped.'
